name: Pipeline DevSecOps - Clínica Médica

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependências e Ferramentas de Segurança
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Instalamos ferramentas de SAST, SCA e testes
          pip install bandit pip-audit pytest pytest-asyncio httpx

      - name: Security Gate 1 - Análise de Dependências (SCA)
        # Falha o pipeline se houver bibliotecas vulneráveis instaladas
        run: pip-audit

      - name: Security Gate 2 - Análise Estática (SAST)
        # -ll: Bloqueia APENAS em vulnerabilidades de severidade ALTA (High)
        # -ii: Ignora problemas de confiança baixa (reduz falsos positivos)
        run: bandit -r . -ll -ii -x ./tests

      - name: Security Gate 3 - Testes de Negócio e Autorização (DAST Local/Pytest)
        # Executa a suíte de testes. Se um teste de segurança falhar, o pipeline para.
        run: pytest -v